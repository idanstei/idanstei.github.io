      - Philips Healthcare Fellow - Stanford University Department of Radiology, for development of a dual ultrasound/photoacoustic imaging system.
      - Sir Peter Michael Foundation Fellow - Selected as a national researcher for excellence in clinical translation of prostate cancer photoacoustic imaging at Stanford University.
      - Sir Charles Clore Scholar - Selected as one of nine scholars nationwide.
