- title: Executive Summary
  type: list
  contents:
    - Vice President of Research & Development and Biomedical Engineering Ph.D. with 25+ years of experience leading multidisciplinary teams to develop and clinically validate medical diagnostic devices. Progressed from deep technical expertise in biomedical imaging, algorithms, and instrumentation to executive R&D leadership. Advanced technologies from early-stage research through TRL 5 development, including multi-site clinical trials and system-level architecture redesigns that reduced manufacturing costs by 33% and device footprint by 5x.

- title: Experience
  type: time_table
  contents:
    - title: Senior Director of Research and Development / Vice President for Research and Development
      institution: Endra Life Sciences Inc., Ann Arbor, MI
      year: 2024 - Present
      description: >
        Promoted to VP R&D following successful execution of the company's clinical strategy; restructured the R&D organization and redirected development priorities, contributing to $5M in subsequent fundraising.
        Led an 8-month engineering effort to identify and resolve the causes of clinical performance failure in the company’s thermoacoustic diagnostic device, taking the system from TRL 0 to TRL 5. Used k-Wave, Ansys HFSS, and internally developed tools to model the acoustic system that identified signal aliasing caused by rib interference, with interference signals hundreds of times larger than the clinical targets.
        Redesigned the hardware by optimizing RF antenna spacing relative to the acoustic sensor, resolving the interference without requiring a full system redesign.
        Improved device clinical efficacy, measured by correlation with MRI-PDFF, from 4% to 89%. Directed multi-site clinical trials involving 70+ patients and supported peer-reviewed publications.
        Led a focused interdisciplinary team tasked with designing a 3rd-generation combined device (ultrasound and thermoacoustic) to address usability issues. The design reduced projected manufacturing costs by 33%, the probe footprint by half, and the overall system footprint by 5x.
    
    - title: Applied Science Team Leader
      institution: Endra Life Sciences Inc., Ann Arbor, MI
      year: 2021 - 2024
      description: >
        Assumed technical ownership for the first- and second-generation device pipeline and independently analyzed clinical data that identified major discrepancies in baseline efficacy, including a 4% correlation with gold-standard measurements.
        Presented the clinical and technical findings directly to the Board, resulting in a 50% reduction in operating costs and a change in the company’s technical direction.
        Led the redesign of the acoustic sensor, increasing baseline sensitivity by 6 dB and reducing array-wide sensitivity variation 3-fold.
        Managed system specifications, QA procedures, and clinical deployment training, while coordinating technical work between company leadership and external engineering contractors.
        Major contributor to clinical trial design and execution, medical-device validation, ISO 13485, and design verification and validation.
    
    - title: Principal Researcher
      institution: Vortex Medical Imaging, Sunnyvale, CA
      year: 2020 - 2021
      description: >
        First US employee hire of an early-stage computational ultrasound startup. Joined a computer-science-focused team as the primary ultrasound imaging expert. Established the company’s US acoustic laboratory, including equipment procurement, custom 3D-printed components, and core testing infrastructure.
        Defined the technical specifications and characterization methods for a 3D ultrasound probe based on Full Matrix Capture and real-time full waveform inversion for imaging tissue density and speed of sound.
        Worked with external vendors to transition the probe from design to physical prototype, including defining QA requirements and performance targets for the software and computer science team.
    
    - title: Team Leader & Postdoctoral Fellow
      institution: Stanford Univ. School of Medicine, Radiology Dept., Palo Alto, CA
      year: 2016 - 2021
      description: >
        Managed a $1M development budget and a multidisciplinary team of 10–20 engineers, computer scientists, biologists, and clinical researchers. Led development of optical and acoustic technologies from laboratory prototypes toward clinical applications.
        Led development of a combined photoacoustic and ultrasound prostate imaging system from initial design through prototype development and clinical testing. Authored initial designs and managed external subcontractors responsible for custom ultrasound arrays, multi-port optical waveguides, and specialized cart housings.
        Implemented real-time signal-processing algorithms and software workflows using MATLAB, Python, and CUDA, increasing photoacoustic imaging data-processing speed by 10x.
        Designed and executed a validation program covering preclinical testing, ex vivo studies, and a first-in-human feasibility clinical trial for early cancer detection. The project was selected as one of five Stanford projects to receive funding from Philips Healthcare based on its potential for clinical and commercial translation.

